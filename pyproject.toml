[project]
name = "skoll"
dynamic = ["version"]
description = "A small Python toolkit for domain-driven, message-based backends (Result type, value objects, asyncpg repositories, NATS mediator, async DI)"
readme = "README.md"
authors = [
    { name = "Monzon Diarra", email = "diarramonzon4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.0",
    "asyncpg>=0.31.0",
    "attrs>=25.4.0",
    "certifi>=2026.1.4",
    "cryptography>=48.0.0",
    "nats-py[nkeys]>=2.13.1",
    "ulid>=1.1",
]

[project.scripts]
skoll = "skoll:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.basedpyright]
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnknownMemberType = false
typeCheckingMode = "recommended"
reportUnknownVariableType = false
